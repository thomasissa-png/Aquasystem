name: CI

# Pipeline bloquant : lint -> typecheck -> build (export statique)
#   + tests unitaires (Vitest) + E2E (Playwright). Activés par @qa.
# PAS de job deploy pour l'instant (tokens Cloudflare non configurés —
# marche à suivre dans docs/infra/infrastructure.md > "Déploiement").
# Job lighthouse + régression visuelle : commentés, à activer post-launch.

on:
  push:
    branches: ['**']
  pull_request:
    branches: [main]

# Annule les runs obsolètes sur la même branche.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types et build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Typecheck (tsc --noEmit)
        run: npm run typecheck

      - name: Build (Next.js export statique)
        run: npm run build

      - name: Vérifier la sortie statique
        run: test -d out && test -f out/index.html

  # ---------------------------------------------------------------------------
  # Tests unitaires + intégration (Vitest) — bloquant.
  # Inclut le typecheck des fichiers de test (tsconfig.test.json).
  # ---------------------------------------------------------------------------
  tests:
    name: Tests unitaires (Vitest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Typecheck des tests
        run: npx tsc --noEmit -p tsconfig.test.json
      - name: Vitest (unit + intégration handler)
        run: npm run test

  # ---------------------------------------------------------------------------
  # Tests E2E (Playwright, chromium uniquement) — bloquant.
  # Réseau /api/contact et events Umami 100% interceptés → déterministe.
  # ---------------------------------------------------------------------------
  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - name: Install Playwright chromium
        run: npx playwright install --with-deps chromium
      - name: Playwright E2E (webServer = npm run dev sur 127.0.0.1)
        run: npm run test:e2e
      - name: Upload rapport en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ---------------------------------------------------------------------------
  # POST-LAUNCH — à activer quand l'environnement de rendu est stabilisé.
  # ---------------------------------------------------------------------------
