<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Aquasystem">
  <!-- Logo v5 "Rive privée" (D-46, direction fondateur : « simple et élégant,
       un signe d'eau, beau bleu, ton sur ton — l'or et le noir n'ont rien à voir
       avec le métier »). Tuile bleu profond + vague d'eau ton sur ton. Le signe
       parle du métier (eau / piscine). Monochrome, lisible onglet clair et sombre. -->
  <rect width="64" height="64" rx="14" ry="14" fill="#16304A"/>
  <g fill="none" stroke-linecap="round">
    <path d="M15 39 C 23 31 29 31 34 36 C 39 41 45 41 50 34" stroke="#4E86A6" stroke-width="3.2"/>
    <path d="M19 45 C 24.5 40.5 29.5 40.5 33 43.5" stroke="#3C6E8E" stroke-width="2.8"/>
  </g>
</svg>
